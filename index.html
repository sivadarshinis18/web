<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Contact Form</h1>
        <p class="subtitle">
            Share your details and choose the options that suit you.
        </p>

        <form id="contactForm">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>

            <label for="message">Message</label>
            <textarea id="message" placeholder="How can we help?" required></textarea>

            <label>Courses of Interest</label>
            <div class="options">
                <label><input type="checkbox" name="course" value="English"> English</label>
                <label><input type="checkbox" name="course" value="Math"> Math</label>
                <label><input type="checkbox" name="course" value="Science"> Science</label>
                <label><input type="checkbox" name="course" value="History"> History</label>
            </div>

            <label>Gender</label>
            <div class="options">
                <label><input type="radio" name="gender" value="Male" required> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
            </div>

            <label for="country">Country</label>
            <select id="country" required>
                <option value="">Select a country</option>
                <option value="India">India</option>
                <option value="USA">USA</option>
                <option value="UK">UK</option>
                <option value="Canada">Canada</option>
                <option value="Australia">Australia</option>
            </select>

            <button type="submit">Submit</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
